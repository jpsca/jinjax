name: test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
      - name: "Installs dependencies"
        run: |
          pip install -U uv
          uv sync --group dev --group test
          pip install -e .
      - run: make lint
  tests:
    name: tests
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15", "3.14t", "3.15t"]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: "Installs dependencies"
        run: |
          pip install -U uv
          uv sync --group dev --group test
          pip install -e .
      - run: make test
  tests-windows:
    name: tests (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: "Installs dependencies"
        run: |
          pip install -U uv
          uv sync --group dev --group test
          pip install -e .
      - run: uv run pytest -x src/jinjax tests
